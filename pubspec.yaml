name: thumbnail
description: "High-performance video thumbnail engine: cached, scheduled, cancellable thumbnail generation from asset, file, and network videos."
version: 0.1.0
homepage: https://github.com/omar-hanafy/thumbnail
repository: https://github.com/omar-hanafy/thumbnail
issue_tracker: https://github.com/omar-hanafy/thumbnail/issues

topics:
  - video
  - thumbnail
  - cache
  - performance
  - media

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.1.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.tomars.thumbnail
        pluginClass: ThumbnailPlugin
      ios:
        pluginClass: ThumbnailPlugin
